<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>html+css实现漂亮的透明动态漂浮登录页面</title>
</head>
 
<body>
    <section>
        <!-- 背景颜色 -->
        <div class="color"></div>
        <div class="color"></div>
        <div class="color"></div>
        <div class="box">
            <!-- 背景圆 -->
            <div class="circle" style="--x:0"></div>
            <div class="circle" style="--x:1"></div>
            <div class="circle" style="--x:2"></div>
            <div class="circle" style="--x:3"></div>
            <div class="circle" style="--x:4"></div>
            <!-- 登录框 -->
            <div class="container">
                <div class="form">
                    <h2>登录</h2>
                    <form>
                        <div class="inputBox">
                            <input type="text" placeholder="姓名">
 
                        </div>
                        <div class="inputBox">
                            <input type="password" placeholder="密码">
 
                        </div>
                        <div class="inputBox">
                            <input type="submit" value="登录">
 
                        </div>
                        <p class="forget">忘记密码?<a href="#">
                                点击这里
                            </a></p>
                        <p class="forget">没有账户?<a href="#">
                                注册
                            </a></p>
                    </form>
                    <p id="login-error" style="color:#ff6b6b;font-size:13px;margin-top:5px;min-height:18px;text-align:center;"></p>
                    <script>
                    document.querySelector('.form form').addEventListener('submit', function(e) {
                        e.preventDefault();
                        var inputs = this.querySelectorAll('input');
                        var username = inputs[0] ? inputs[0].value.trim() : '';
                        var password = inputs[1] ? inputs[1].value.trim() : '';
                        var errEl = document.getElementById('login-error');
                        errEl.textContent = '';

                        if (!username) {
                            errEl.textContent = '请输入姓名';
                            return;
                        }
                        if (!password) {
                            errEl.textContent = '请输入密码';
                            return;
                        }
                        if (password.length < 6) {
                            errEl.textContent = '密码长度至少6位';
                            return;
                        }
                        alert('登录成功');
                    });
                    </script>
                </div>
            </div>
        </div>
    </section>
</body>
 
</html>
